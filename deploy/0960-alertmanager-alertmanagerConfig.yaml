apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  labels:
    app.kubernetes.io/component: alert-router
    app.kubernetes.io/instance: main
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: kube-prometheus
  name: operator-agent-webhook
  namespace: monitoring
spec:
  route:
    receiver: operator-agent-webhook
    groupBy:
    - namespace
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 12h
    # 保留现有配置对心跳告警和信息抑制告警的处理。
    matchers:
    - name: alertname
      matchType: '!~'
      value: Watchdog|InfoInhibitor
  receivers:
  - name: operator-agent-webhook
    webhookConfigs:
    - url: http://operator-agent-service.monitoring.svc.cluster.local/api/webhooks/alertmanager
      sendResolved: true
      httpConfig:
        authorization:
          type: Bearer
          credentials:
            name: operator-agent-service-alertmanager
            key: webhook-token

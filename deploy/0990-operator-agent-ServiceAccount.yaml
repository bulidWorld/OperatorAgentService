apiVersion: v1
kind: ServiceAccount
metadata:
  name: operator-agent-service
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: operator-agent-service-events
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: operator-agent-service-events
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: operator-agent-service-events
subjects:
  - kind: ServiceAccount
    name: operator-agent-service
    namespace: monitoring
---
apiVersion: v1
kind: Service
metadata:
  name: operator-agent-service
  namespace: monitoring
spec:
  selector:
    app: operator-agent-service
  type: NodePort
  ports:
    - port: 80
      targetPort: 9090
      nodePort: 32003

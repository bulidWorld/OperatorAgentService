apiVersion: apps/v1
kind: Deployment
metadata:
  name: operator-agent-service
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: operator-agent-service
  template:
    metadata:
      labels:
        app: operator-agent-service
    spec:
      serviceAccountName: operator-agent-service
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 1000
      containers:
        - name: web
          image: lingxi.image.io/kunpeng/operator-agent/operator-agent-service:v0.001
          ports:
            - containerPort: 9090
          envFrom:
            - configMapRef:
                name: operator-agent-service-config
          env:
            - name: ALERTMANAGER_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: operator-agent-service-alertmanager
                  key: webhook-token
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: operator-agent-service-db
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: operator-agent-service-db
                  key: port
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: operator-agent-service-db
                  key: name
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: operator-agent-service-db
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: operator-agent-service-db
                  key: password
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: operator-agent-service-llm
                  key: api-key
          volumeMounts:
            - name: logs
              mountPath: /var/service/operator-agent-service/log
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 9090
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 9090
            initialDelaySeconds: 20
      volumes:
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: operator-agent-service
  namespace: monitoring
spec:
  selector:
    app: operator-agent-service
  type: NodePort
  ports:
    - port: 80
      targetPort: 9090
      nodePort: 32003

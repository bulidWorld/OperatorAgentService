openapi: 3.0.3
info:
  title: Operator Agent Service API
  version: 1.0.0
  description: Kubernetes 监控查询、集群 Events 查询和 Alertmanager webhook 接口。所有时间字符串使用 ISO 8601。
servers:
  - url: /
paths:
  /api/events:
    get:
      operationId: getKubernetesEvents
      summary: 查询所有对象类型的 Kubernetes Events
      description: >-
        查询 PostgreSQL 中 source=kubernetes 的事件，覆盖有命名空间和集群级对象，
        不限定 involvedObject.kind。后台采集器使用 ServiceAccount 对 core/v1 Events
        每 5 分钟执行集群范围分页 LIST，按 (source, external_id) 更新统一表。
        结果按 lastSeenAt DESC、id DESC 排列；cursor 为不透明分页游标。
      parameters:
        - name: namespace
          in: query
          description: 不传时包含所有命名空间及集群级事件
          schema: { type: string, minLength: 1, maxLength: 63 }
        - name: objectType
          in: query
          description: involvedObject.kind，如 Pod、Node、Deployment
          schema: { type: string, minLength: 1 }
        - name: objectName
          in: query
          schema: { type: string, minLength: 1 }
        - name: objectUid
          in: query
          description: 用于精确筛选重建前后的同名对象
          schema: { type: string, minLength: 1 }
        - name: eventType
          in: query
          description: Kubernetes Event type 原值
          schema: { type: string, minLength: 1 }
        - name: hours
          in: query
          description: 以查询时刻为终点的时间窗口，默认 24 小时
          schema: { type: integer, minimum: 1, maximum: 720, default: 24 }
        - name: limit
          in: query
          description: 返回最新记录的上限，默认 100 条
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: cursor
          in: query
          description: 上一页响应的 nextCursor；需与筛选条件保持一致
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: Kubernetes Events；没有事件时 events 为空数组
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KubernetesEventsResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/monitor:
    get:
      operationId: getMonitor
      summary: 查询 Node 或 Pod 监控面板
      parameters:
        - name: scope
          in: query
          description: 默认 nodes
          schema: { type: string, enum: [nodes, pods], default: nodes }
        - name: minutes
          in: query
          description: 默认 60
          schema: { type: integer, enum: [15, 60, 360, 1440], default: 60 }
        - name: step
          in: query
          description: Prometheus query_range 计算间隔，单位秒；默认 auto
          schema: { type: string, enum: [auto, '5', '15', '30', '60', '300'], default: auto }
      responses:
        '200':
          description: 面板数据
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '502': { $ref: '#/components/responses/UpstreamError' }
  /api/node-status:
    get:
      operationId: getNodeStatus
      summary: 查询 Node 或 Pod 的实时资源指标和可用状态
      parameters:
        - in: query
          name: scope
          schema: { type: string, enum: [nodes, pods], default: nodes }
      responses:
        '200':
          description: 当前资源指标及可用状态；演示模式返回空资源和 null 状态
          content:
            application/json:
              schema:
                type: object
                required: [statuses, resources]
                properties:
                  resources:
                    type: array
                    items: { $ref: '#/components/schemas/Resource' }
                  statuses:
                    nullable: true
                    type: object
                    additionalProperties: { type: boolean }
        '502': { $ref: '#/components/responses/UpstreamError' }
  /api/alerts:
    get:
      operationId: getAlerts
      summary: 查询资源告警
      description: 从统一表 resource_alert_events 查询未解决的 Alertmanager 告警和 Kubernetes Events。refresh=true 时先立即从 Kubernetes 集群同步事件，再返回数据库结果。
      parameters:
        - name: refresh
          in: query
          description: true 时在查询数据库前立即同步 Kubernetes Events；默认 false
          schema: { type: boolean, default: false }
        - name: limit
          in: query
          description: 每页最多返回的告警数，默认 50
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: cursor
          in: query
          description: 上一页响应的 nextCursor
          schema: { type: string, minLength: 1 }
        - name: source
          in: query
          description: 按告警来源筛选
          schema: { type: string, enum: [alertmanager, kubernetes] }
        - name: alertType
          in: query
          description: 按告警类型精确筛选
          schema: { type: string }
        - name: severity
          in: query
          description: 按告警级别精确筛选
          schema: { type: string }
        - name: from
          in: query
          description: 告警发生时间起点（含）
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: 告警发生时间终点（含）
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: 数据库中的资源告警；refresh=true 时包含本次同步结果
          content:
            application/json:
              schema:
                type: object
                required: [source, refreshed, synchronizedEvents, alerts, nextCursor]
                properties:
                  source: { type: string, enum: [database] }
                  refreshed: { type: boolean, description: 本次请求是否触发了 Kubernetes 同步 }
                  synchronizedEvents: { type: integer, nullable: true, description: 本次读取到的 Kubernetes Event 数；未同步时为 null }
                  alerts:
                    type: array
                    items: { $ref: '#/components/schemas/AlertRow' }
                  nextCursor: { type: string, nullable: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }
        '502': { $ref: '#/components/responses/UpstreamError' }
    delete:
      operationId: clearAlerts
      summary: 标记告警已解决
      description: 可按 ids 人工清除选中告警，或按 filters 清除所有匹配告警；均保留记录并记录解决来源。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [ids]
                  properties:
                    ids: { type: array, minItems: 1, items: { type: integer, minimum: 1 } }
                - type: object
                  required: [filters]
                  properties:
                    filters:
                      type: object
                      properties:
                        source: { type: string, enum: [alertmanager, kubernetes] }
                        alertType: { type: string }
                        severity: { type: string }
                        from: { type: string, format: date-time }
                        to: { type: string, format: date-time }
      responses:
        '200':
          description: 清除结果
          content:
            application/json:
              schema:
                type: object
                required: [cleared]
                properties:
                  cleared: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/webhooks/alertmanager:
    post:
      operationId: receiveAlertmanagerWebhook
      summary: 接收 Alertmanager v4 webhook
      description: Bearer token 来自 ALERTMANAGER_WEBHOOK_TOKEN。请求体上限 1 MiB，每批最多 1000 条告警；firing 按 (source=alertmanager, external_id=fingerprint) 更新统一表，resolved 将对应告警标记为已解决并记录解决来源为 alertmanager。完整原始数据保留在 PostgreSQL。
      security:
        - alertmanagerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlertmanagerWebhook' }
      responses:
        '200':
          description: 接收成功
          content:
            application/json:
              schema:
                type: object
                required: [received, active]
                properties:
                  received: { type: integer, minimum: 0 }
                  active: { type: integer, minimum: 0 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/Unavailable' }
components:
  securitySchemes:
    alertmanagerBearer:
      type: http
      scheme: bearer
  responses:
    BadRequest:
      description: 参数或 JSON 数据无效
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Bearer token 错误
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnsupportedMediaType:
      description: Content-Type 不是 application/json
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServerError:
      description: 服务端存储或处理失败
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unavailable:
      description: 未配置 webhook token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UpstreamError:
      description: 数据源查询失败
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    KubernetesEvent:
      type: object
      required: [eventUid, source, objectType, objectName, namespace, objectUid, objectApiVersion, description, severity, occurredAt, alertType, eventType, count, sourceComponent, sourceHost, lastSeenAt]
      properties:
        eventUid: { type: string, description: Kubernetes Event metadata.uid }
        source: { type: string, enum: [kubernetes] }
        objectType: { type: string, nullable: true, description: involvedObject.kind，如 Pod、Node；上游缺失时为空 }
        objectName: { type: string, nullable: true, description: involvedObject.name }
        namespace: { type: string, nullable: true, description: 集群级对象或上游未提供时为空 }
        objectUid: { type: string, nullable: true, description: involvedObject.uid }
        objectApiVersion: { type: string, nullable: true, description: involvedObject.apiVersion }
        description: { type: string, nullable: true, description: Kubernetes Event message }
        severity: { type: string, nullable: true, description: Warning 对应 warning、Normal 对应 info；其他值为空 }
        occurredAt: { type: string, format: date-time, description: 首次发生时间；缺失时使用 metadata.creationTimestamp }
        alertType: { type: string, nullable: true, description: Kubernetes Event reason }
        eventType: { type: string, nullable: true, description: Kubernetes Event type 原值，如 Normal 或 Warning }
        count: { type: integer, minimum: 1, description: 同一 Event 的累计发生次数，缺失时为 1 }
        sourceComponent: { type: string, nullable: true }
        sourceHost: { type: string, nullable: true }
        lastSeenAt: { type: string, format: date-time }
    KubernetesEventsResponse:
      type: object
      required: [queriedAt, events, nextCursor]
      properties:
        queriedAt: { type: string, format: date-time }
        events:
          type: array
          items: { $ref: '#/components/schemas/KubernetesEvent' }
        nextCursor: { type: string, nullable: true, description: 没有下一页时为 null }
    Resource:
      type: object
      required: [name, namespace, cpu, memory, network, ready]
      properties:
        name: { type: string }
        namespace: { type: string }
        cpu: { type: number, nullable: true, description: 'Node 为百分比，Pod 为 CPU 核数' }
        memory: { type: number, nullable: true, description: 'Node 为百分比，Pod 为字节' }
        network: { type: number, nullable: true, description: '字节/秒' }
        ready: { type: boolean, nullable: true }
        restarts24h: { type: number, nullable: true, description: 最近 24 小时容器重启次数，仅 Pod scope 返回；指标不可用时为 null }
    DashboardAlert:
      type: object
      required: [name, severity, state, resource, summary]
      properties:
        name: { type: string }
        severity: { type: string }
        state: { type: string }
        resource: { type: string }
        summary: { type: string }
    Dashboard:
      type: object
      required: [mode, resources, alerts, trend, trendStep, trendWindow, stepSelection, updatedAt]
      properties:
        mode: { type: string, enum: [demo, live] }
        resources:
          type: array
          items: { $ref: '#/components/schemas/Resource' }
        alerts:
          type: array
          items: { $ref: '#/components/schemas/DashboardAlert' }
        trend:
          type: array
          items:
            type: object
            required: [time, value]
            properties:
              time: { type: number, description: Unix 时间戳（秒） }
              value: { type: number }
        trendStep: { type: number, description: 实际计算间隔（秒） }
        trendWindow: { type: number, description: PromQL rate 窗口（秒） }
        stepSelection:
          oneOf:
            - { type: string, enum: [auto] }
            - { type: number, enum: [5, 15, 30, 60, 300] }
        updatedAt: { type: string, format: date-time }
    AlertRow:
      type: object
      required: [id, source, name, severity, objectType, resource, description, activeAt]
      properties:
        id: { type: integer }
        source: { type: string, enum: [alertmanager, kubernetes] }
        name: { type: string }
        severity: { type: string }
        objectType: { type: string, nullable: true, description: Pod、Node 等对象类型 }
        resource: { type: string }
        description: { type: string }
        activeAt: { type: string, format: date-time, nullable: true }
    StringMap:
      type: object
      additionalProperties: { type: string }
    AlertmanagerAlert:
      type: object
      required: [status, labels, annotations, startsAt]
      additionalProperties: true
      properties:
        status: { type: string, enum: [firing, resolved] }
        labels: { $ref: '#/components/schemas/StringMap' }
        annotations: { $ref: '#/components/schemas/StringMap' }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        generatorURL: { type: string }
        fingerprint: { type: string, minLength: 1 }
    AlertmanagerWebhook:
      type: object
      required: [version, alerts]
      additionalProperties: true
      properties:
        version: { type: string, enum: ['4'] }
        receiver: { type: string }
        status: { type: string, enum: [firing, resolved] }
        groupKey: { type: string }
        groupLabels: { $ref: '#/components/schemas/StringMap' }
        commonLabels: { $ref: '#/components/schemas/StringMap' }
        commonAnnotations: { $ref: '#/components/schemas/StringMap' }
        externalURL: { type: string }
        truncatedAlerts: { type: integer, minimum: 0 }
        alerts:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/AlertmanagerAlert' }

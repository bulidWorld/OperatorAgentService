$schema: https://json-schema.org/draft/2020-12/schema
$title: ACTIVITY_SNAPSHOT content schema
description: >-
  项目定义的 ACTIVITY_SNAPSHOT.content 数据结构。AG-UI 外层事件结构不在此 schema 范围内。
type: object
additionalProperties: true
required:
  - schemaVersion
  - run
  - events
properties:
  schemaVersion:
    type: integer
    const: 2
    description: content 模型版本；不兼容变更时递增。
  run:
    $ref: '#/$defs/run'
  events:
    type: array
    description: 按 sequence 升序排列的平铺活动条目。
    items:
      oneOf:
        - $ref: '#/$defs/reasoning'
        - $ref: '#/$defs/modelSummary'
        - $ref: '#/$defs/toolExecution'
$defs:
  timestamp:
    type: string
    format: date-time
    description: ISO-8601 UTC 时间字符串。
  nullableTimestamp:
    description: 可为空的 UTC 时间戳；事件或运行尚未结束时使用 null。
    oneOf:
      - $ref: '#/$defs/timestamp'
      - type: 'null'
  status:
    type: string
    enum: [queued, running, awaiting_approval, completed, failed, cancelled]
    description: >-
      运行或活动事件的生命周期状态。queued 表示等待执行，running 表示执行中，
      awaiting_approval 表示等待人工审批，completed 表示成功完成，failed 表示执行失败，
      cancelled 表示执行被取消。
  run:
    type: object
    description: 一次 agent 执行及其所属 thread 的状态和时间信息。
    additionalProperties: true
    required: [runId, threadId, status, startedAt, updatedAt, finishedAt, error]
    properties:
      runId:
        type: string
        minLength: 1
        description: 本次 agent 运行的标识。
      threadId:
        type: string
        minLength: 1
        description: 所属对话 thread 的标识。
      status:
        $ref: '#/$defs/status'
      startedAt:
        $ref: '#/$defs/timestamp'
      updatedAt:
        $ref: '#/$defs/timestamp'
      finishedAt:
        $ref: '#/$defs/nullableTimestamp'
      error:
        oneOf:
          - type: string
          - type: 'null'
        description: 运行失败时的安全错误摘要。
  baseEvent:
    type: object
    description: 所有活动事件共用的身份、顺序、生命周期和输入输出字段。
    additionalProperties: true
    required: [id, sequence, type, title, status, startedAt, updatedAt, finishedAt, input, output, error]
    properties:
      id:
        type: string
        minLength: 1
        description: 活动条目的稳定唯一标识。
      sequence:
        type: integer
        minimum: 1
        description: 在本活动时间线中单调递增的展示顺序。
      type:
        type: string
        description: 活动事件类型；具体事件定义会将其限制为明确的类型值。
      title:
        type: string
        minLength: 1
        description: 面向用户的简短标题。
      status:
        $ref: '#/$defs/status'
      startedAt:
        $ref: '#/$defs/timestamp'
      updatedAt:
        $ref: '#/$defs/timestamp'
      finishedAt:
        $ref: '#/$defs/nullableTimestamp'
      input:
        type: [object, 'null']
        description: 脱敏后的输入摘要，不得包含隐藏推理或敏感参数。
      output:
        description: 规范化输出；具体结构由活动类型决定。
      error:
        oneOf:
          - type: string
          - type: 'null'
        description: 失败时的安全错误摘要。
  toolExecution:
    description: 一次实际开始执行的工具调用及其结果。
    allOf:
      - $ref: '#/$defs/baseEvent'
      - type: object
        required: [type, tool, correlation]
        properties:
          type:
            const: tool_execution
            description: 固定为 tool_execution，表示工具执行活动。
          tool:
            type: object
            description: 被调用工具的标识信息。
            additionalProperties: true
            required: [name]
            properties:
              name:
                type: string
                minLength: 1
                description: 工具名称。
              server:
                type: string
                description: 提供该工具的 MCP server 名称；无法确定时可省略。
          correlation:
            type: object
            description: 将工具活动与 AG-UI 工具调用开始和结果事件关联起来。
            additionalProperties: false
            required: [toolCallId]
            properties:
              toolCallId:
                type: string
                minLength: 1
                description: 对应 TOOL_CALL_START 与 TOOL_CALL_RESULT 的 tool_call_id。
  reasoning:
    description: route_turn、assistant 或 assess_pod 步骤的 Thinking 活动，从 STEP_STARTED 开始，到 STEP_FINISHED 结束。
    allOf:
      - $ref: '#/$defs/baseEvent'
      - type: object
        properties:
          type:
            const: reasoning
          title:
            const: Thinking
          output:
            $ref: '#/$defs/stepOutput'
  modelSummary:
    description: finalize 步骤的模型总结活动，从 STEP_STARTED 开始，到 STEP_FINISHED 结束。
    allOf:
      - $ref: '#/$defs/baseEvent'
      - type: object
        properties:
          type:
            const: model_summary
          title:
            const: 模型总结
          output:
            $ref: '#/$defs/stepOutput'
  stepOutput:
    description: 步骤中的助手文本和 AG-UI 公开推理摘要；执行期间或无消息时可为 null。
    oneOf:
      - type: object
        additionalProperties: false
        required: [messages]
        properties:
          messages:
            type: array
            description: 按首次收到内容的顺序排列的消息；每条消息的文本由其 delta 拼接。
            items:
              type: object
              additionalProperties: false
              required: [messageId, type, text]
              properties:
                messageId:
                  type: string
                  minLength: 1
                type:
                  enum: [text, reasoning]
                text:
                  type: string
      - type: 'null'
